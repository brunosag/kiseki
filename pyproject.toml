[project]
name = "kiseki"
version = "0.2.0"
description = "Gradient-based vs evolutionary optimization of neural networks: worker, CLI and app server"
requires-python = ">=3.14"
dependencies = [
    "jax>=0.11.2",
    "msgspec>=0.22.0",
    "numpy>=2.5.0",
    "safetensors>=0.8.0",
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "starlette>=1.8.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.11.2"]

[project.scripts]
kiseki = "kiseki.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.31.0",
    "pytest>=9.1.0",
    "ruff>=0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiseki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: needs a CUDA device; skipped when none is visible",
    "network: downloads data; skipped unless KISEKI_NETWORK_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
