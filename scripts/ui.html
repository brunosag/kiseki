<script src="https://cdn.tailwindcss.com"></script>

<div class="p-6">
	<div class="flex flex-col md:flex-row gap-6">
		<div class="max-w-3xl md:max-w-md w-full border p-6 rounded-2xl">
			<h3 class="text-xl mb-4 border-b pb-2">Configuration</h3>
			<div class="flex flex-col gap-2 mt-4">
				<div
					v-for="(props, key) in config_schema"
					:key="key"
					class="flex items-center justify-between"
				>
					<label class="text-sm text-zinc-600">{{ props.label }}</label>
					<select
						v-if="props.type === 'select'"
						v-model="config[key]"
						:disabled="is_running"
						class="w-40 px-2.5 py-2 enabled:cursor-pointer disabled:bg-zinc-50 border rounded-lg enabled:shadow-sm bg-white"
					>
						<option v-for="option in props.options" :key="option.value" :value="option.value">
							{{ option.label }}
						</option>
					</select>
					<input
						v-else
						v-model.number="config[key]"
						:type="props.type"
						:step="props.step"
						:disabled="is_running"
						class="w-40 px-2.5 py-1.5 border rounded-lg enabled:shadow-sm bg-white disabled:bg-zinc-50"
					/>
				</div>
			</div>

			<div class="mt-6 p-4 border rounded-xl">
				<h4 class="mb-4 border-b pb-1">
					{{ config_schema.optimizer.options.find(o => o.value === config.optimizer).label }}
					parameters
				</h4>
				<div class="grid grid-cols-[max-content_auto_1fr] items-center gap-y-2 gap-x-3">
					<div
						v-for="param in optimizers_schema[config.optimizer]"
						:key="param.key"
						class="contents"
					>
						<span v-katex="param.label" class="text-lg"></span>
						<input
							:type="param.type"
							:step="param.step"
							:disabled="is_running"
							v-model.number="opt_params[config.optimizer][param.key]"
							class="w-24 py-1.5 px-2.5 border rounded-lg enabled:shadow-sm bg-white disabled:bg-zinc-50"
						/>
						<label class="text-zinc-500 text-sm font-normal">{{ param.desc }}</label>
					</div>
				</div>
			</div>

			<button
				v-on:click="is_running ? stop_experiment=true : start_experiment=true"
				v-bind:class="is_running ? 'bg-red-600 hover:bg-red-700' : 'bg-zinc-800 hover:bg-zinc-900'"
				class="mt-6 w-full py-2 px-4 active:scale-[0.99] text-white font-semibold rounded-lg transition-colors"
			>
				{{ is_running ? 'Stop experiment' : 'Start experiment' }}
			</button>
		</div>

		<div class="flex flex-col w-full border p-6 rounded-2xl h-fit">
			<h3 class="text-xl mb-4 border-b pb-2">Metrics</h3>
			<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
				<!-- <div class="stat-card">
					<p class="stat-label">Step</p>
					<p class="stat-value">{{current_step}}</p>
				</div>
				<div class="stat-card">
					<p class="stat-label">Loss</p>
					<p class="stat-value">{{current_loss.toFixed(4)}}</p>
				</div>
				<div class="stat-card">
					<p class="stat-label">Best accuracy</p>
					<p class="stat-value">{{best_acc.toFixed(2)}}%</p>
				</div> -->
			</div>

			<div class="mt-6 w-full">
				<!-- <plotly :data="plot_data" :layout="plot_layout"></plotly> -->
			</div>
		</div>
	</div>
</div>

<script>
	const customStyles = document.createElement('style');
	customStyles.type = 'text/tailwindcss';
	customStyles.innerHTML = `
		.stat-card { @apply p-4 rounded-xl border; }
		.stat-label { @apply text-sm text-zinc-500; }
		.stat-value { @apply text-2xl; }
	`;
	document.head.appendChild(customStyles);

	document.addEventListener('DOMContentLoaded', () => {
		document.querySelectorAll('link[rel="stylesheet"]').forEach((sheet) => {
			if (!sheet.href.includes('katex.min.css')) {
				sheet.remove();
			}
		});

		const footer = document.querySelector('footer');
		if (footer) {
			footer.remove();
		}

		document.querySelectorAll('.container').forEach((element) => {
			element.classList.remove('container');
		});
	});
</script>
