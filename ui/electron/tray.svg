<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- The logo as a symbolic panel icon: the trajectory cut out of a white square. -->
  <mask id="cut">
    <rect width="16" height="16" fill="#fff"/>
    <path d="M4 11.5c2.3 0 3.2-6 8-6.5" fill="none" stroke="#000" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="12" cy="5" r="1.4" fill="#000"/>
  </mask>
  <rect x="1" y="1" width="14" height="14" rx="3.5" fill="#fff" mask="url(#cut)"/>
</svg>
